name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    
    - name: Build project
      run: npm run build || echo "Build skipped"
    
    - name: Create deployment package
      run: |
        mkdir -p deploy
        if [ -d "dist" ]; then
          cp -r dist deploy/
        fi
        if [ -d "src" ]; then
          cp -r src deploy/
        fi
        cp package.json deploy/
        if [ -f "package-lock.json" ]; then
          cp package-lock.json deploy/
        fi
        cp .env.example deploy/ || echo "No .env.example found"
        cd deploy
        npm ci --production --legacy-peer-deps || npm install --production --legacy-peer-deps
        zip -r ../bot-deploy.zip .
    
    - name: Upload deployment package
      uses: actions/upload-artifact@v3
      with:
        name: bot-deploy
        path: bot-deploy.zip
    
    - name: Deploy to server (via SSH)
      if: false  # Désactivé temporairement
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "bot-deploy.zip"
        target: "/home/${{ secrets.SERVER_USERNAME }}/deploy/"
    
    - name: Deploy on server
      if: false  # Désactivé temporairement
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /home/${{ secrets.SERVER_USERNAME }}/deploy/
          unzip -o bot-deploy.zip -d bot
          cd bot
          npm install --production --legacy-peer-deps
          pm2 restart nox-bot || pm2 start dist/bot.js --name nox-bot
          pm2 save
